    <use href="#tl-d" x="265" y="421"/><use href="#tl-d" x="341" y="434"/><use href="#tl-d" x="417" y="447"/>
    <use href="#tl-d" x="265" y="505"/><use href="#tl-d" x="341" y="518"/><use href="#tl-d" x="417" y="531"/>
    <use href="#tr-d" x="699" y="337"/><use href="#tr-d" x="623" y="350"/><use href="#tr-d" x="547" y="363"/>
    <use href="#tr-d" x="699" y="421"/><use href="#tr-d" x="623" y="434"/><use href="#tr-d" x="547" y="447"/>
    <use href="#tr-d" x="699" y="505"/><use href="#tr-d" x="623" y="518"/><use href="#tr-d" x="547" y="531"/>
  </g>
</svg>
